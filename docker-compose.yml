services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_ORDER_WHATSAPP_TEXT: ${NEXT_PUBLIC_ORDER_WHATSAPP_TEXT}
    restart: always
    environment:
      # Uses the DATABASE_URL from .env directly (e.g. Neon / any managed Postgres)
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SELLER_EMAIL: ${SELLER_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_ORDER_WHATSAPP_TEXT: ${NEXT_PUBLIC_ORDER_WHATSAPP_TEXT}
    # Visit http://YOUR_VPS_IP:3000
    ports:
      - "3000:3000"
